[project]
name = "CRYOtools"
version = "0.1.0"

description = "Tools for processing and analysing DKIST Cryo-NIRSP spectropolarimetric data"

authors = [
    {name = "Richard Morton", email = "richard.morton@northumbria.ac.uk"},
]
readme = "README.md"
license = {file = "LICENSE"}
# TODO: Verify this minimum Python version against your oldest tested environment
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    # JAX is intentionally not pinned to a hardware variant here.
    # Users must install the correct JAX build for their hardware
    # (CPU / CUDA / Metal) before installing CRYOtools.
    # See: https://jax.readthedocs.io/en/latest/installation.html
    "jax>=0.4.25",
    "numba>=0.58",
    "sunpy>=5.0",
    "dkist>=1.9",
    "hvpy>=1.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
# Development / testing dependencies — install with:  pip install -e ".[dev]"
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
"Source code" = "https://github.com/Richardjmorton/CRYOtools"
"Bug tracker" = "https://github.com/Richardjmorton/CRYOtools/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages = { find = {} }

[tool.setuptools.package-data]
# Bundle the reference solar and telluric model files with the package.
"CRYOtools" = ["models/*.out", "models/*.npy"]
